name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -v
        env:
          SECRET_KEY: ci-secret-key-at-least-32-bytes-long-xxxx
          DATABASE_URL: sqlite://
          GEMINI_API_KEY: fake
